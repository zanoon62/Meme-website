<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7AD" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#554418" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Container -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="10" />

  <!-- Inner Subtle Accent Border -->
  <rect x="44" y="44" width="424" height="424" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />

  <!-- Monogram "M" Emblem -->
  <g filter="url(#goldGlow)">
    <path fill="url(#goldGrad)" d="
      M 112,360 
      V 136 
      H 162 
      L 256,280 
      L 350,136 
      H 400 
      V 360 
      H 352 
      V 212 
      L 272,336 
      H 240 
      L 160,212 
      V 360 
      Z" />
  </g>

  <!-- MEME Label -->
  <text x="256" y="424" font-family="system-ui, -apple-system, 'Playfair Display', sans-serif" font-size="42" font-weight="900" fill="url(#goldGrad)" letter-spacing="14" text-anchor="middle">MEME</text>
</svg>
