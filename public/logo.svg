<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxurious warm ivory gradient -->
    <linearGradient id="bgIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#F2EBDC" />
    </linearGradient>
    
    <!-- Warm dark espresso text gradient -->
    <linearGradient id="textEspresso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B18" />
      <stop offset="100%" stop-color="#0F0C0A" />
    </linearGradient>

    <!-- Champagne gold accent stroke -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9A7B52" />
    </linearGradient>
  </defs>

  <!-- Circular Badge Outer Frame -->
  <circle cx="256" cy="256" r="240" fill="url(#bgIvory)" stroke="url(#goldAccent)" stroke-width="4" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1F1B18" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Top "ME" -->
  <text x="256" y="195" 
        font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif" 
        font-size="110" 
        font-weight="700" 
        fill="url(#textEspresso)" 
        letter-spacing="6" 
        text-anchor="middle">ME</text>

  <!-- Diagonal Dividing Slash -->
  <line x1="160" y1="260" x2="352" y2="236" stroke="url(#goldAccent)" stroke-width="6" stroke-linecap="round" />

  <!-- Bottom "ME" -->
  <text x="256" y="340" 
        font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif" 
        font-size="110" 
        font-weight="700" 
        fill="url(#textEspresso)" 
        letter-spacing="6" 
        text-anchor="middle">ME</text>

  <!-- Sub-label SUITED BY MEME -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="19" 
        font-weight="600" 
        fill="#8C7355" 
        letter-spacing="10" 
        text-anchor="middle">SUITED BY MEME</text>
</svg>
