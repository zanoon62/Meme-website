# Nginx reverse proxy for MEME Store — replace `meme-eg.store` below with
# the real domain once it's pointed at this VPS (see docs/VPS_DEPLOYMENT.md).
#
# This file only touches THIS project's server blocks — it is mounted
# read-only into the shared nginx:alpine container's conf.d/, alongside
# (never overwriting) any other project's own conf.d file on the box.

proxy_cache_path /var/cache/nginx/meme levels=1:2 keys_zone=meme_cache:10m max_size=200m inactive=60m use_temp_path=off;

# ── HTTP: ACME challenge passthrough, everything else redirects to HTTPS ──
server {
    listen 80;
    server_name meme-eg.store www.meme-eg.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name meme-eg.store www.meme-eg.store;

    ssl_certificate     /etc/letsencrypt/live/meme-eg.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meme-eg.store/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m; # covers the 10MB product-image upload limit + headroom

    # Stripe webhook: raw body must reach the app completely untouched —
    # verifying the signature depends on byte-for-byte fidelity.
    location /api/stripe/webhook {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Micro-cache the three read-heavy public JSON endpoints — replaces
    # Vercel's edge cache for these routes. Keyed on the full request
    # (including query string), honors the app's own Cache-Control via
    # proxy_cache_valid below; serves stale content while revalidating on
    # a cache miss or backend error, matching stale-while-revalidate intent.
    location ~ ^/api/(products|homepage|categories) {
        proxy_cache meme_cache;
        proxy_cache_valid 200 300s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Object storage — served through the same domain/TLS cert so the
    # frontend's <Image> remotePatterns and CORS stay simple.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
