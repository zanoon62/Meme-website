# Production stack for the VPS. This project must run fully isolated from
# any other project sharing the box:
#   - always deploy with `docker compose -p meme-store ...` (a distinct
#     Compose project name) so `up`/`down` never touch unrelated containers
#   - postgres/redis are reachable solely on the internal `meme_net` network
#   - postgres/redis/minio here are THIS project's own containers, never
#     pointed at anything already running on the host
#
# NOTE: this box already runs a shared, system-wide Nginx (in front of
# another project, `amar-site`) that owns host ports 80/443 — a second
# Nginx in Docker can't also bind them. So `app` and `minio` publish to
# 127.0.0.1-only host ports instead, and the EXISTING system Nginx gets a
# new, separate site file (`deploy/nginx/meme-eg.store` — a real Nginx
# site config, not a Docker-mounted conf.d file) that reverse-proxies to
# them. See docs/VPS_DEPLOYMENT.md for the full picture — there is no
# Docker `nginx`/`certbot` service here; TLS is issued via the system
# certbot already installed on the box.
#
# Usage: docker compose -p meme-store up -d
# Migrations: docker compose -p meme-store run --rm migrate
# See docs/VPS_DEPLOYMENT.md for the full deploy/rollback flow.

services:
  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meme}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meme}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [meme_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-meme}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meme}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [meme_net]
    profiles: ["tools"] # never started by `up`; run explicitly via `run --rm migrate`

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-meme}
    volumes:
      - meme_pg_data:/var/lib/postgresql/data
    networks: [meme_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meme} -d ${POSTGRES_DB:-meme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - meme_redis_data:/data
    networks: [meme_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - meme_minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"
    networks: [meme_net]
    restart: unless-stopped
    # Console (9001) intentionally NOT published — reach it via an SSH
    # tunnel (`ssh -L 9001:localhost:9001 ubuntu@<vps-ip>`) when needed.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  meme_net:
    driver: bridge

volumes:
  meme_pg_data:
  meme_redis_data:
  meme_minio_data:
