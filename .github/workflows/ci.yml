name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build doesn't crash on module-eval-time
          # config checks (Drizzle/Redis/MinIO connections are all lazy —
          # nothing actually connects during `next build`, these just need
          # to be syntactically present).
          DATABASE_URL: "postgres://user:pass@localhost:5432/db"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
